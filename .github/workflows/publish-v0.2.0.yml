name: Publish v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-v0.2.0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript and HACS manifest
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool hacs.json > /dev/null
          grep -Fq 'const COMPET_VFD_VERSION = "0.2.0";' compet-vfd-display-card.js

      - name: Render branding PNG files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          source = Path('brand/icon.svg')
          outputs = [
              (Path('brand/icon.png'), 256),
              (Path('brand/icon@2x.png'), 512),
              (Path('docs/images/icon.png'), 512),
          ]
          for target, size in outputs:
              target.parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(
                  url=str(source),
                  write_to=str(target),
                  output_width=size,
                  output_height=size,
              )
          PY

      - name: Commit generated branding files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/icon.png brand/icon@2x.png docs/images/icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate COMPET branding PNGs"
            git push origin HEAD:main
          fi

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(./*.js brand/icon.png brand/icon@2x.png)
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 "${ASSETS[@]}" --clobber
          else
            gh release create v0.2.0 "${ASSETS[@]}" \
              --target "$(git rev-parse HEAD)" \
              --title "v0.2.0" \
              --notes "Authentic COMPET 18 display geometry, external red decimal marker, photorealistic glass tubes, optional gauge housing and project branding."
          fi
