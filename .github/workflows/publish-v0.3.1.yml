name: Publish v0.3.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-v0.3.1"

permissions:
  contents: write

jobs:
  validate-tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript, metadata and cache keys
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool hacs.json > /dev/null
          python -m json.tool package.json > /dev/null
          grep -Fq 'const COMPET_VFD_VERSION = "0.3.1";' compet-vfd-display-card.js
          grep -Fq '"version": "0.3.1"' package.json
          if grep -n '?v=0.3.0' ./*.js; then
            echo 'Stale v0.3.0 JavaScript import cache key found.' >&2
            exit 1
          fi
          grep -Fq 'export const ORIGINAL_GLYPHS' compet-vfd-glyphs.js
          grep -Fq 'export const ALTERNATIVE_GLYPHS' compet-vfd-glyphs.js
          grep -Fq 'getPointAtLength' compet-vfd-render.js
          grep -Fq 'decimal-marker-svg' compet-vfd-render.js

      - name: Create annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse v0.3.1 >/dev/null 2>&1; then
            git tag -d v0.3.1
            git push origin :refs/tags/v0.3.1 || true
          fi
          git tag -a v0.3.1 -m "COMPET VFD Display Card v0.3.1"
          git push origin v0.3.1

      - name: Wait for standard release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view v0.3.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          gh release create v0.3.1 \
            ./*.js \
            ./brand/icon.png \
            ./brand/icon@2x.png \
            --verify-tag \
            --title "v0.3.1" \
            --notes "Photo-derived SHARP COMPET 18 physical segment reconstruction, explicit phosphor dots, preserved alternative style and a rebuilt faceted decimal marker."

      - name: Record verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.3.1 --json tagName,name,isDraft,isPrerelease,publishedAt,url > release-v0.3.1.json
          git pull --rebase origin main
          git add release-v0.3.1.json
          git commit -m "Verify v0.3.1 GitHub release"
          git push origin HEAD:main
