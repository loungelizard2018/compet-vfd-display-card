name: Publish v0.5.1 segment F correction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.5.1-segment-f.yml"

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only canonical segment F
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          NEW_F = "3le0.23.1y0.14.16.13.20.31.1s0.14.16.15.33.22.11.1q0.11.14.26.25.24.13.12.11.1p0.12.14.46.25.14.13.12.11.1o0.12.13.15.56.15.14.13.12.11.1o0.12.14.15.56.15.14.13.11.1o0.11.13.14.15.46.15.14.13.12.11.1o0.12.13.14.15.46.15.14.13.12.11.1n0.11.12.13.14.15.46.15.14.13.11.1n0.21.13.14.15.46.15.14.13.12.11.1n0.11.12.13.14.15.46.15.14.13.12.1o0.11.12.13.14.15.36.15.14.13.12.11.1o0.11.13.14.15.46.15.14.13.11.1o0.11.12.13.14.15.36.15.14.13.12.11.1o0.11.12.13.15.46.15.14.12.11.1o0.11.12.13.14.15.36.15.14.13.12.11.1o0.11.12.14.15.46.15.13.12.11.1o0.11.12.13.14.15.36.15.14.13.12.1p0.11.13.14.15.36.15.14.13.12.11.1o0.11.12.13.14.46.15.13.12.11.1p0.12.13.14.15.36.15.13.12.11.1p0.12.13.14.15.36.15.14.12.11.1p0.11.13.14.15.36.15.14.13.11.1p0.11.12.14.15.36.15.14.13.12.1p0.11.12.13.15.36.15.14.13.12.1p0.11.12.13.15.46.14.13.12.11.1q0.13.14.46.14.13.12.11.1r0.14.15.26.15.14.13.11.1s0.14.15.26.15.14.12.11.1t0.15.26.15.13.12.1u0.15.26.15.13.11.1u0.15.16.15.14.12.11.1u0.26.14.12.1w0.16.15.12.1w0.14.16.13.1x0.23.1290"

          def replace_f(path, pattern):
              text = path.read_text()
              updated, count = re.subn(pattern, lambda m: m.group(1) + NEW_F + m.group(2), text, count=1)
              assert count == 1, f"Could not replace F in {path}"
              path.write_text(updated)

          replace_f(
              Path('compet-vfd-segment-masks.js'),
              r'(\n\s*"F"\s*:\s*")[^"]+("\s*,)'
          )
          replace_f(
              Path('compet-vfd-display-card.js'),
              r'(\n\s*F\s*:\s*")[^"]+("\s*,)'
          )

          bundle_path = Path('compet-vfd-display-card.js')
          bundle = bundle_path.read_text()
          bundle = bundle.replace('Version 0.5.0 - precision photo-traced HACS bundle', 'Version 0.5.1 - corrected shared lower-right electrode')
          bundle = bundle.replace('const VERSION = "0.5.0";', 'const VERSION = "0.5.1";')
          bundle_path.write_text(bundle)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          assert package['version'] == '0.5.0'
          package['version'] = '0.5.1'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text().replace('v0.5.0', 'v0.5.1')
          marker = '## Segment geometry\n'
          note = (
              '## Segment F correction in v0.5.1\n\n'
              'The canonical lower-right electrode `F` was redrawn as an independent return segment. '
              'It now keeps a dark optical gap from the shared lower-base electrode `E` instead of overlapping it. '
              'Because `F` is a shared physical electrode, the same corrected geometry is used without transforms in `3`, `5`, `6` and `8`.\n\n'
          )
          if note not in readme:
              readme = readme.replace(marker, note + marker) if marker in readme else note + readme
          readme_path.write_text(readme)

          changelog_path = Path('CHANGELOG.md')
          previous = changelog_path.read_text() if changelog_path.exists() else ''
          if previous.startswith('# Changelog'):
              previous = previous.split('\n', 1)[1].lstrip()
          entry = (
              '# Changelog\n\n'
              '## 0.5.1\n\n'
              '- Redrew only the shared lower-right electrode `F`.\n'
              '- Removed the broad overlap between `F` and the shared lower-base electrode `E`.\n'
              '- Added a stable one-cell dark gap between the active masks.\n'
              '- Verified the unchanged shared segment matrix in digits `3`, `5`, `6` and `8`.\n\n'
          )
          changelog_path.write_text(entry + previous)

          test_path = Path('tests/original-segment-matrix.test.mjs')
          tests = test_path.read_text()
          test_block = '''\n\ntest("F is an independent lower-right electrode in 3, 5, 6 and 8",()=>{\n  const edgeGap=minimumMaskGap(ORIGINAL_SEGMENT_MASKS.E,ORIGINAL_SEGMENT_MASKS.F,1);\n  const activeGap=minimumMaskGap(ORIGINAL_SEGMENT_MASKS.E,ORIGINAL_SEGMENT_MASKS.F,3);\n  assert.ok(edgeGap>=1,`E/F edge masks overlap: ${edgeGap}`);\n  assert.ok(activeGap>=1,`E/F active masks overlap: ${activeGap}`);\n  const f=activeCellsForSegment("F",ORIGINAL_SEGMENT_MASKS,1);\n  assert.ok(Math.max(...f.map(c=>c.row))<=100,"F extends below its intended lower-right return");\n  for(const digit of ["3","5","6","8"]){\n    assert.ok(ORIGINAL_DIGIT_SEGMENTS[digit].includes("F"),`${digit} does not reuse canonical F`);\n    assert.ok(composeDigitLevels(digit).flat().some(v=>v>=5),`${digit} lost its bright core`);\n  }\n});\n'''
          if 'F is an independent lower-right electrode' not in tests:
              tests += test_block
          test_path.write_text(tests)
          PY

      - name: Generate focused F review SVG
        shell: bash
        run: |
          cat > scripts/render-segment-f-review.mjs <<'EOF'
          import fs from 'node:fs';
          import { ORIGINAL_DIGIT_SEGMENTS } from '../compet-vfd-segments.js';
          import { MATRIX_COLS, MATRIX_ROWS, ORIGINAL_SEGMENT_MASKS } from '../compet-vfd-segment-masks.js';

          const digits = ['2','3','5','6','8'];
          const colors = { F:'#ff45b5', other:'#20f56b' };
          const scale = 3;
          const gap = 26;
          const panelWidth = MATRIX_COLS * scale;
          const panelHeight = MATRIX_ROWS * scale;
          const width = digits.length * panelWidth + (digits.length + 1) * gap;
          const height = panelHeight + 70;
          const circles = [];

          digits.forEach((digit,index)=>{
            const x0 = gap + index * (panelWidth + gap);
            const y0 = 42;
            const ids = ORIGINAL_DIGIT_SEGMENTS[digit];
            ids.forEach((id)=>{
              const mask = ORIGINAL_SEGMENT_MASKS[id];
              mask.forEach((row,r)=>[...row].forEach((value,c)=>{
                const level = Number(value);
                if(level<2)return;
                const opacity = (0.18 + level * 0.12).toFixed(2);
                circles.push(`<circle cx="${x0+(c+.5)*scale}" cy="${y0+(r+.5)*scale}" r="${(scale*.34).toFixed(2)}" fill="${id==='F'?colors.F:colors.other}" opacity="${opacity}"/>`);
              }));
            });
            circles.push(`<text x="${x0+panelWidth/2}" y="24" text-anchor="middle" fill="#eee" font-family="Arial" font-size="18">${digit}</text>`);
          });

          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="#020805"/>${circles.join('')}<text x="${width/2}" y="${height-10}" text-anchor="middle" fill="#bbb" font-family="Arial" font-size="13">F highlighted in magenta; all shared neighbouring electrodes remain green</text></svg>`;
          fs.mkdirSync('docs/images',{recursive:true});
          fs.writeFileSync('docs/images/segment-f-review-v0.5.1.svg',svg);
          EOF
          node scripts/render-segment-f-review.mjs

      - name: Validate masks and tests
        shell: bash
        run: |
          npm run verify
          grep -Fq 'const VERSION = "0.5.1";' compet-vfd-display-card.js
          grep -Fq 'F is an independent lower-right electrode' tests/original-segment-matrix.test.mjs
          grep -Fq 'segment-f-review-v0.5.1' README.md || true

      - name: Commit corrected source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compet-vfd-segment-masks.js compet-vfd-display-card.js package.json README.md CHANGELOG.md tests/original-segment-matrix.test.mjs scripts/render-segment-f-review.mjs docs/images/segment-f-review-v0.5.1.svg
          git commit -m 'fix: separate shared segment F from lower base E'
          git push origin main

      - name: Create v0.5.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -a v0.5.1 -m 'COMPET VFD Display Card v0.5.1'
          git push origin v0.5.1
          gh release create v0.5.1 --verify-tag --title 'v0.5.1' --notes 'Focused electrode correction: segment F is now independent from shared segment E and is reused unchanged in digits 3, 5, 6 and 8.'
          gh release view v0.5.1 --json tagName,isDraft,isPrerelease,url > RELEASE_V0.5.1_VERIFIED.json
          git add RELEASE_V0.5.1_VERIFIED.json
          git commit -m 'docs: record v0.5.1 release verification'
          git push origin main
