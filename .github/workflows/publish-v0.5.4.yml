name: Publish v0.5.4 visible F-E junction

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/v0.5.4-validation-trigger"
      - "tools/release_v0_5_4.py"
      - ".github/workflows/publish-v0.5.4.yml"
  push:
    branches: [main]
    paths:
      - ".github/v0.5.4-trigger"

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build visible junction correction
        run: python tools/release_v0_5_4.py

      - name: Validate bundle and geometry
        run: |
          npm run verify
          grep -Fq 'const VERSION = "0.5.4";' compet-vfd-display-card.js
          grep -Fq 'data-segment-id="F-E"' compet-vfd-display-card.js
          grep -Fq 'originalActiveGlyph(character,id)+originalJunctionBridge(character,id)' compet-vfd-display-card.js
          grep -Fq 'originalActiveGlyph(character, id) + originalJunctionBridge(character, id)' compet-vfd-render.js

      - name: Commit v0.5.4 sources
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compet-vfd-*.js package.json README.md README.de.md CHANGELOG.md tests/v0_5_4_visible_junction.test.mjs
          git commit -m 'fix: render a visible dotted F-E junction'
          git push origin main

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify refs/tags/v0.5.4 >/dev/null; then
            git tag -a v0.5.4 -m 'COMPET VFD Display Card v0.5.4'
            git push origin v0.5.4
          fi
          if ! gh release view v0.5.4 >/dev/null 2>&1; then
            gh release create v0.5.4 \
              --verify-tag \
              --title 'v0.5.4' \
              --notes 'Makes the diagonal F/E phosphor junction clearly visible in digits 3, 5, 6 and 8 by rendering nine tightly spaced phosphor dots in both the self-contained HACS bundle and the modular renderer.'
          fi
          gh release view v0.5.4 --json tagName,isDraft,isPrerelease,url > RELEASE_V0.5.4_VERIFIED.json
          git add RELEASE_V0.5.4_VERIFIED.json
          git commit -m 'docs: record v0.5.4 release verification'
          git push origin main
