name: Verify v0.2.1 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/verify-v0.2.1"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub release object
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.2.1 --json tagName,name,isDraft,isPrerelease,url,publishedAt > .github/release-v0.2.1-status.json
          rm -f .github/verify-v0.2.1 .github/workflows/verify-v0.2.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify v0.2.1 GitHub release"
          git push origin HEAD:main
