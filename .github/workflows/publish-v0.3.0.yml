name: Publish v0.3.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-v0.3.0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool hacs.json > /dev/null
          grep -Fq 'const COMPET_VFD_VERSION = "0.3.0";' compet-vfd-display-card.js

      - name: Refresh tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v0.3.0
          git push origin v0.3.0 --force
          ASSETS=(./*.js brand/icon.png brand/icon@2x.png examples/basic.yaml examples/complete.yaml)
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 "${ASSETS[@]}" --clobber
          else
            gh release create v0.3.0 "${ASSETS[@]}" --verify-tag --title "v0.3.0" --notes "Original COMPET 18 glyph reconstruction is now the default. The former glyph set remains available with style: alternative. Glow and phosphor colours are configurable and the external decimal marker has a more realistic faceted plastic appearance."
          fi

      - name: Record release verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v0.3.0 --json tagName,name,isDraft,isPrerelease,publishedAt,url > release-v0.3.0.json