name: Publish v0.4.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.4.0.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate package
        run: |
          npm run verify
          python -m json.tool hacs.json > /dev/null
      - name: Create v0.4.0 tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.4.0 -m "COMPET VFD Display Card v0.4.0"
          git push origin v0.4.0
