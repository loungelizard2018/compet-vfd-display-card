name: Bootstrap COMPET VFD package

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/complete"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and unpack package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/compet-vfd-display-card.zip
          rm -rf /tmp/compet-vfd-display-card
          mkdir -p /tmp/compet-vfd-display-card
          unzip -q /tmp/compet-vfd-display-card.zip -d /tmp/compet-vfd-display-card
          rsync -a --delete --exclude='.git/' /tmp/compet-vfd-display-card/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Initial COMPET VFD display card"
          git push
