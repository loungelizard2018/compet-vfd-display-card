name: Run v0.5.1 segment F correction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-v0.5.1-segment-f.yml"

permissions:
  contents: write

jobs:
  apply-test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused F correction
        run: python scripts/apply-segment-f-v051.py

      - name: Verify source
        run: npm run verify

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compet-vfd-segment-masks.js compet-vfd-display-card.js package.json README.md CHANGELOG.md tests/original-segment-matrix.test.mjs
          git commit -m 'fix: separate shared segment F from lower base E'
          git push origin main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a v0.5.1 -m 'COMPET VFD Display Card v0.5.1'
          git push origin v0.5.1
          gh release create v0.5.1 --verify-tag --title 'v0.5.1' --notes 'Focused segment correction: F no longer overlaps E and is reused unchanged in digits 3, 5, 6 and 8.'
          gh release view v0.5.1 --json tagName,isDraft,isPrerelease,url > RELEASE_V0.5.1_VERIFIED.json
          git add RELEASE_V0.5.1_VERIFIED.json
          git commit -m 'docs: record v0.5.1 release verification'
          git push origin main
