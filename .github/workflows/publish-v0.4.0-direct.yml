name: Publish v0.4.0 direct

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.4.0-direct.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin refs/tags/v0.4.0 >/dev/null 2>&1; then
            git tag -a v0.4.0 -m "COMPET VFD Display Card v0.4.0"
            git push origin v0.4.0
          fi
          if ! gh release view v0.4.0 >/dev/null 2>&1; then
            gh release create v0.4.0 \
              ./*.js \
              ./brand/icon.png \
              ./brand/icon@2x.png \
              --verify-tag \
              --generate-notes \
              --title "v0.4.0"
          fi
