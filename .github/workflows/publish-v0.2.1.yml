name: Publish v0.2.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-v0.2.1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool hacs.json > /dev/null
          python -m json.tool package.json > /dev/null
          grep -Fq 'const COMPET_VFD_VERSION = "0.2.1";' compet-vfd-display-card.js
          grep -Fq '"version": "0.2.1"' package.json
          test -s brand/icon.png
          test -s brand/icon@2x.png
          test -s examples/basic.yaml
          test -s examples/complete.yaml

      - name: Remove one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/release-v0.2.1 .github/workflows/publish-v0.2.1.yml
          git add -A
          git commit -m "Finalize v0.2.1 release contents"
          git push origin HEAD:main

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD)"
          git tag -a v0.2.1 "$TARGET" -m "COMPET VFD Display Card v0.2.1"
          git push origin refs/tags/v0.2.1
          gh release create v0.2.1 \
            ./*.js \
            ./brand/icon.png \
            ./brand/icon@2x.png \
            ./examples/basic.yaml \
            ./examples/complete.yaml \
            --target "$TARGET" \
            --title "v0.2.1" \
            --notes "HACS release with fixed README branding, complete example YAML files and refreshed frontend module cache keys."
