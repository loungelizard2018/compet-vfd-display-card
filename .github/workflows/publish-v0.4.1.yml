name: Publish v0.4.1 bundled release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.4.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate self-contained HACS bundle
        shell: bash
        run: |
          node --check compet-vfd-display-card.js
          grep -Fq 'const VERSION = "0.4.1";' compet-vfd-display-card.js
          grep -Fq 'Version 0.4.1 — self-contained HACS bundle' compet-vfd-display-card.js
          if grep -Eq '^[[:space:]]*(import|export)[[:space:]]' compet-vfd-display-card.js; then
            echo "The HACS entry file still contains module imports/exports"
            exit 1
          fi
          python -m json.tool hacs.json > /dev/null
          test "$(python -c 'import json; print(json.load(open("package.json"))["version"])')" = "0.4.1"

      - name: Create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "v0.4.1" >/dev/null 2>&1; then
            git tag -a v0.4.1 -m "COMPET VFD Display Card v0.4.1"
            git push origin v0.4.1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.4.1 >/dev/null 2>&1; then
            gh release upload v0.4.1 compet-vfd-display-card.js brand/icon.png brand/icon@2x.png --clobber
          else
            gh release create v0.4.1 \
              compet-vfd-display-card.js \
              brand/icon.png \
              brand/icon@2x.png \
              --verify-tag \
              --title "v0.4.1" \
              --notes "Fixes HACS loading by shipping compet-vfd-display-card.js as one self-contained bundle with no relative runtime imports. Preserves the photographic 48x80 four-level COMPET electrode renderer and style: alternative."
          fi
