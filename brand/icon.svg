<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">COMPET VFD Display Card icon</title>
  <desc id="desc">A glowing green COMPET-style digit eight inside a vintage glass display tube with a red decimal marker.</desc>
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313438"/>
      <stop offset="0.42" stop-color="#111315"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfffe8" stop-opacity=".16"/>
      <stop offset=".14" stop-color="#7fffa4" stop-opacity=".025"/>
      <stop offset=".48" stop-color="#001507" stop-opacity=".18"/>
      <stop offset=".86" stop-color="#7fffa4" stop-opacity=".035"/>
      <stop offset="1" stop-color="#dfffe8" stop-opacity=".14"/>
    </linearGradient>
    <radialGradient id="tube" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0b3a1d" stop-opacity=".48"/>
      <stop offset=".62" stop-color="#021108" stop-opacity=".92"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="mesh" width="18" height="15.6" patternUnits="userSpaceOnUse">
      <path d="M4.5 0h9L18 7.8l-4.5 7.8h-9L0 7.8Z" fill="none" stroke="#9ad9ab" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="84" fill="url(#housing)" stroke="#030303" stroke-width="12"/>
  <rect x="34" y="34" width="444" height="444" rx="70" fill="none" stroke="#85898d" stroke-opacity=".72" stroke-width="4"/>
  <rect x="76" y="52" width="360" height="388" rx="70" fill="#010302" stroke="#000" stroke-width="12"/>
  <rect x="91" y="67" width="330" height="358" rx="60" fill="url(#tube)" stroke="#b9ddc2" stroke-opacity=".25" stroke-width="4"/>
  <rect x="99" y="77" width="314" height="338" rx="53" fill="url(#mesh)"/>
  <path d="M156 116C191 92 310 92 352 116" fill="none" stroke="#1ef56b" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M356 126C374 164 372 204 348 237" fill="none" stroke="#1ef56b" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M344 274C365 311 358 352 329 383" fill="none" stroke="#1ef56b" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M316 389C275 408 189 407 153 382" fill="none" stroke="#1ef56b" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M148 374C126 336 128 296 154 263" fill="none" stroke="#1ef56b" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M157 235C137 196 140 154 163 123" fill="none" stroke="#1ef56b" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M158 249C203 229 305 229 347 250" fill="none" stroke="#1ef56b" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="none" stroke="#e9ffef" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 13" opacity=".95">
    <path d="M156 116C191 92 310 92 352 116"/><path d="M356 126C374 164 372 204 348 237"/><path d="M344 274C365 311 358 352 329 383"/><path d="M316 389C275 408 189 407 153 382"/><path d="M148 374C126 336 128 296 154 263"/><path d="M157 235C137 196 140 154 163 123"/><path d="M158 249C203 229 305 229 347 250"/>
  </g>
  <rect x="91" y="67" width="330" height="358" rx="60" fill="url(#glass)"/>
  <path d="M126 94C160 74 208 71 245 75" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 442l22 25-22 25-22-25Z" fill="#f04436" stroke="#80130d" stroke-width="4"/>
</svg>
