<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMPET 18 pixel segment editor</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070b09;color:#edf7f0}
body{margin:0;padding:20px;background:#070b09}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border:1px solid #26362c;border-radius:12px;background:#0d1510}.layout{display:grid;grid-template-columns:minmax(360px,620px) minmax(260px,420px);gap:18px;margin-top:18px}.panel{padding:14px;border:1px solid #26362c;border-radius:14px;background:#0c120f}.matrix-wrap{position:relative;display:inline-block}.reference{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:.45;transform-origin:center}.grid{position:relative;display:grid;grid-template-columns:repeat(24,14px);grid-template-rows:repeat(40,14px);gap:1px;background:#1c2a21;padding:1px;user-select:none}.cell{width:14px;height:14px;background:#101713}.cell.on{background:#2bff75;box-shadow:0 0 6px #20f56b}.cell:hover{outline:1px solid #fff}.preview{display:grid;grid-template-columns:repeat(24,7px);grid-template-rows:repeat(40,7px);gap:1px;background:#152019;padding:4px;width:max-content}.preview i{width:7px;height:7px;background:#0c130f}.preview i.on{background:#32ff79;box-shadow:0 0 4px #20f56b}.preview i.a{background:#ff4358}.preview i.b{background:#ff9e2f}.preview i.c{background:#ffe04b}.preview i.d{background:#3bdb6f}.preview i.e{background:#36dce7}.preview i.f{background:#4f8cff}.preview i.g{background:#a767ff}.preview i.h{background:#ff54c8}textarea{width:100%;min-height:180px;background:#060a07;color:#c8f8d5;border:1px solid #26362c;border-radius:8px;padding:8px;font-family:ui-monospace,monospace}button,select,input{font:inherit}button{padding:7px 10px}.status{font-family:ui-monospace,monospace;color:#a8b9ad;margin-top:8px}.svg-preview svg{width:240px;height:400px;background:#030704;border:1px solid #27372d}
@media(max-width:900px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(24,11px);grid-template-rows:repeat(40,11px)}.cell{width:11px;height:11px}}
</style>
</head>
<body>
<h1>COMPET 18 pixel / dot segment editor</h1>
<p>Branch-only design tool. Edit one canonical A–H mask; digit previews always compose the shared segment objects.</p>
<div class="controls">
<label>Segment <select id="segment"></select></label>
<label>Digit <select id="digit"></select></label>
<label><input id="identity" type="checkbox"> identity colours</label>
<label>Reference <input id="file" type="file" accept="image/*"></label>
<label>Photo opacity <input id="opacity" type="range" min="0" max="1" step=".01" value=".45"></label>
<label>Photo scale <input id="photoScale" type="range" min=".2" max="4" step=".01" value="1"></label>
<label>X <input id="photoX" type="range" min="-300" max="300" value="0"></label>
<label>Y <input id="photoY" type="range" min="-300" max="300" value="0"></label>
<button id="undo">Undo</button><button id="reset">Reset segment</button><button id="exportJson">Export JSON</button><button id="exportPng">Export PNG</button>
</div>
<div class="layout">
<section class="panel"><h2>24 × 40 editable mask</h2><div class="matrix-wrap"><img id="reference" class="reference" alt="local reference"><div id="grid" class="grid"></div></div><div id="status" class="status"></div></section>
<section class="panel"><h2>Composite digit</h2><div id="preview" class="preview"></div><h2>Matrix-derived SVG helper</h2><div id="svgPreview" class="svg-preview"></div><h2>Export</h2><textarea id="output" spellcheck="false"></textarea></section>
</div>
<script type="module">
import { MATRIX_COLS, MATRIX_ROWS, ORIGINAL_SEGMENT_MASKS, composeDigitMask, maskToSvgCellPath } from "../compet-vfd-segment-masks.js";
import { ORIGINAL_DIGIT_SEGMENTS } from "../compet-vfd-segments.js";
const ids=Object.keys(ORIGINAL_SEGMENT_MASKS), colours={A:"a",B:"b",C:"c",D:"d",E:"e",F:"f",G:"g",H:"h"};
for(const id of ids){const o=document.createElement("option");o.value=id;o.textContent=id;segment.append(o)}
for(const d of "0123456789"){const o=document.createElement("option");o.value=d;o.textContent=d;digit.append(o)}digit.value="4";
const original=Object.fromEntries(ids.map(id=>[id,[...ORIGINAL_SEGMENT_MASKS[id]]]));
const working=Object.fromEntries(ids.map(id=>[id,[...ORIGINAL_SEGMENT_MASKS[id]]]));
const history=[];let drawing=false,paintValue=true;
function get(r,c){return working[segment.value][r][c]==="1"}
function set(r,c,value){const row=[...working[segment.value][r]];row[c]=value?"1":"0";working[segment.value][r]=row.join("")}
function snapshot(){history.push({id:segment.value,rows:[...working[segment.value]]});if(history.length>80)history.shift()}
function renderGrid(){grid.innerHTML="";for(let r=0;r<MATRIX_ROWS;r++)for(let c=0;c<MATRIX_COLS;c++){const cell=document.createElement("i");cell.className="cell"+(get(r,c)?" on":"");cell.dataset.r=r;cell.dataset.c=c;cell.title=`row ${r}, col ${c}: ${get(r,c)?"on":"off"}`;grid.append(cell)}status.textContent=`segment ${segment.value} — ${working[segment.value].join("").replaceAll("0","").length} active cells`;renderPreview();renderSvg()}
function renderPreview(){preview.innerHTML="";const activeIds=ORIGINAL_DIGIT_SEGMENTS[digit.value];const owner=new Map();for(const id of activeIds)working[id].forEach((row,r)=>[...row].forEach((v,c)=>{if(v==="1")owner.set(`${r}:${c}`,id)}));for(let r=0;r<MATRIX_ROWS;r++)for(let c=0;c<MATRIX_COLS;c++){const i=document.createElement("i"),id=owner.get(`${r}:${c}`);if(id)i.className="on "+(identity.checked?colours[id]:"");preview.append(i)}}
function renderSvg(){const path=maskToSvgCellPath(working[segment.value],80/MATRIX_COLS,132/MATRIX_ROWS);svgPreview.innerHTML=`<svg viewBox="0 0 80 132"><path d="${path}" fill="#20f56b"/><path d="M40 3V129" stroke="#807c64" stroke-width=".6" stroke-dasharray="2 2"/></svg>`}
function applyCell(target){if(!target.classList.contains("cell"))return;set(Number(target.dataset.r),Number(target.dataset.c),paintValue);renderGrid()}
grid.addEventListener("pointerdown",e=>{e.preventDefault();snapshot();drawing=true;paintValue=!e.target.classList.contains("on");applyCell(e.target);grid.setPointerCapture(e.pointerId)});grid.addEventListener("pointermove",e=>{if(drawing)applyCell(document.elementFromPoint(e.clientX,e.clientY))});grid.addEventListener("pointerup",()=>drawing=false);grid.addEventListener("pointercancel",()=>drawing=false);
segment.addEventListener("change",renderGrid);digit.addEventListener("change",renderPreview);identity.addEventListener("change",renderPreview);
undo.addEventListener("click",()=>{const item=history.pop();if(!item)return;working[item.id]=item.rows;segment.value=item.id;renderGrid()});
reset.addEventListener("click",()=>{snapshot();working[segment.value]=[...original[segment.value]];renderGrid()});
exportJson.addEventListener("click",()=>{output.value=JSON.stringify({segment:segment.value,mask:working[segment.value]},null,2);output.select()});
exportPng.addEventListener("click",()=>{const scale=12,c=document.createElement("canvas");c.width=MATRIX_COLS*scale;c.height=MATRIX_ROWS*scale;const x=c.getContext("2d"),mask=composeDigitMask(digit.value,working);x.fillStyle="#030704";x.fillRect(0,0,c.width,c.height);x.fillStyle="#32ff79";mask.forEach((row,r)=>[...row].forEach((v,col)=>{if(v==="1")x.fillRect(col*scale,r*scale,scale-1,scale-1)}));const a=document.createElement("a");a.download=`compet-digit-${digit.value}-mask.png`;a.href=c.toDataURL("image/png");a.click()});
file.addEventListener("change",()=>{const f=file.files?.[0];if(f)reference.src=URL.createObjectURL(f)});function photoTransform(){reference.style.opacity=opacity.value;reference.style.transform=`translate(${photoX.value}px,${photoY.value}px) scale(${photoScale.value})`}for(const e of [opacity,photoScale,photoX,photoY])e.addEventListener("input",photoTransform);photoTransform();renderGrid();
</script>
</body></html>
