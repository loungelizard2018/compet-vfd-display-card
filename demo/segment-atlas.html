<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMPET fine matrix atlas</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070b09;color:#eef7f0}body{margin:0;padding:24px}section{margin:22px 0;padding:14px;border:1px solid #283a2e;border-radius:12px;background:#0c120f}.row{display:flex;gap:12px;overflow-x:auto}.item{text-align:center;flex:0 0 190px}.stage{position:relative;width:180px;height:370px;background:#020503;border:1px solid #34483a}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:.52}.dots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(48,3px);grid-template-rows:repeat(80,3px);gap:.75px;padding:5px}.dots i{width:3px;height:3px;position:relative}.dots i::after{content:"";position:absolute;inset:25%;border-radius:50%}.dots i.l1::after{background:#2d7841}.dots i.l2::after{background:#37c85f}.dots i.l3::after{background:#d8ffe3;box-shadow:0 0 2px #20f56b}.name{font-weight:700;margin-top:6px}.sub{font-size:11px;color:#8ca094}</style></head><body>
<h1>COMPET 18 — derived 48×80 four-level masks</h1><p>Original photographs are displayed behind every composite. This page is branch-only and does not change the released card.</p>
<section><h2>Shared segments A–H</h2><div id="segments" class="row"></div></section><section><h2>Composite digits 0–9 over references</h2><div id="digits" class="row"></div></section>
<script type="module">import{ORIGINAL_SEGMENT_MASKS,composeDigitMask}from"../compet-vfd-segment-masks.js";import{ORIGINAL_DIGIT_SEGMENTS}from"../compet-vfd-segments.js";
function item(mask,title,sub,ref=""){const box=document.createElement("div");box.className="item";const stage=document.createElement("div");stage.className="stage";if(ref){const img=document.createElement("img");img.src=ref;stage.append(img)}const dots=document.createElement("div");dots.className="dots";for(const row of mask)for(const value of row){const i=document.createElement("i");i.className=`l${value}`;dots.append(i)}stage.append(dots);box.append(stage);const n=document.createElement("div");n.className="name";n.textContent=title;box.append(n);const s=document.createElement("div");s.className="sub";s.textContent=sub;box.append(s);return box}
const refs={};for(const d of"0123456789"){try{refs[d]=(await(await fetch(`./references/${d}.txt`)).text()).trim()}catch{refs[d]=""}}for(const id of Object.keys(ORIGINAL_SEGMENT_MASKS))segments.append(item(ORIGINAL_SEGMENT_MASKS[id],id,"shared segment"));for(const d of"0123456789")digits.append(item(composeDigitMask(d),d,ORIGINAL_DIGIT_SEGMENTS[d].join(" + "),refs[d]));</script></body></html>
